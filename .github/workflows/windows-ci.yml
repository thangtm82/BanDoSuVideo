name: Windows desktop CI
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore BanDoSu.slnx
      - name: Build WPF desktop and core
        run: dotnet build BanDoSu.slnx --no-restore -c Release
      - name: Run core smoke tests
        run: dotnet run --project tests/BanDoSu.SmokeTests/BanDoSu.SmokeTests.csproj -c Release
      - name: Publish Windows desktop
        run: dotnet publish src/BanDoSu.Desktop/BanDoSu.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/BanDoSuDesktop
      - uses: actions/upload-artifact@v4
        with:
          name: BanDoSuStudio-win-x64
          path: artifacts/BanDoSuDesktop/
          if-no-files-found: error
