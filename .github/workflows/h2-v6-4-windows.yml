name: H2 V6.4 Windows integration
on:
  pull_request:
    paths:
      - 'src/BanDoSu.Desktop/**'
      - 'engines/h2-historical-world/**'
      - '.github/workflows/h2-v6-4-windows.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python contract tests
        working-directory: engines/h2-historical-world
        run: python -m unittest discover -s tests -p "test_v6_4_*.py" -v
      - name: Build existing H2 Studio WPF
        run: dotnet build src/BanDoSu.Desktop/BanDoSu.Desktop.csproj -c Release
      - name: Build standalone render harness
        run: dotnet build engines/h2-historical-world/integration/H2HistoricalWorld.RenderApp/H2HistoricalWorld.RenderApp.csproj -c Release
